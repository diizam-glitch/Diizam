<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diizam Method</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 90%;
      max-width: 500px;
      padding: 30px 20px;
      background: #1c1c1c;
      border-radius: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 25px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 15px;
    }

    input,
    select {
      background: #292929;
      color: white;
      border: 1px solid #444;
    }

    button {
      border: none;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      display: none;
    }

    #status {
      color: #aaa;
      margin-top: 20px;
      font-size: 14px;
    }

    #download {
      display: none;
      margin-top: 15px;
      color: white;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>DIIZAM METHOD</h1>
    <div class="subtitle">Video Processing</div>

    <input type="file" id="videoInput" accept="video/*">

    <select id="method">
  <option value="original">Original</option>
  <option value="hd">HD Quality</option>
  <option value="60">60 FPS</option>
  <option value="120">120 FPS</option>
      <option value="true60">True 60 FPS</option>
<option value="true120">True 120 FPS</option>
</select>

    <button onclick="processVideo()">PROCESS VIDEO</button>

    <video id="preview" controls></video>

    <div id="status">
      Pilih video terlebih dahulu.
    </div>

    <a id="download" download="diizam-output.mp4">
      DOWNLOAD VIDEO
    </a>
  </div>

  <script>
    const videoInput = document.getElementById("videoInput");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");
    const download = document.getElementById("download");

    const BACKEND_URL =
      "https://diizam-production.up.railway.app";

    videoInput.addEventListener("change", function () {
      const file = this.files[0];

      if (!file) return;

      const url = URL.createObjectURL(file);

      preview.src = url;
      preview.style.display = "block";

      download.style.display = "none";

      status.textContent =
        "Video siap. Pilih method lalu tekan PROCESS VIDEO.";
    });

    async function processVideo() {
      const file = videoInput.files[0];

      if (!file) {
        status.textContent = "Pilih video terlebih dahulu.";
        return;
      }

      const method = document.getElementById("method").value;

      if (method === "original") {
        status.textContent =
          "Untuk sementara pilih 60 FPS atau 120 FPS.";
        return;
      }

      status.textContent =
        "Mengupload dan memproses video... Tunggu.";

      download.style.display = "none";

      const formData = new FormData();

      formData.append("video", file);
      formData.append("method", method);

      try {
        const response = await fetch(
          BACKEND_URL + "/process",
          {
            method: "POST",
            body: formData
          }
        );

        if (!response.ok) {
          throw new Error("Server gagal memproses video.");
        }

        const blob = await response.blob();

        const url = URL.createObjectURL(blob);

        download.href = url;
        download.style.display = "block";

        status.textContent =
          "Selesai! Video berhasil diproses.";

      } catch (error) {
        console.error(error);

        status.textContent =
          "Gagal memproses video. Coba lagi.";
      }
    }
  </script>

</body>
</html>
