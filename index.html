<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Diizam Method</title>


  <!-- =========================
       ONNX RUNTIME WEB
  ========================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.webgpu.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background: #101010;

      color: white;

      font-family: Arial, sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

    }


    .box {

      width: 90%;

      max-width: 500px;

      padding: 30px 20px;

      background: #1c1c1c;

      border-radius: 20px;

      text-align: center;

    }


    h1 {

      margin-bottom: 5px;

    }


    .subtitle {

      color: #999;

      margin-bottom: 25px;

    }


    input,
    select,
    button {

      width: 100%;

      padding: 14px;

      margin-top: 10px;

      border-radius: 10px;

      font-size: 15px;

    }


    input,
    select {

      background: #292929;

      color: white;

      border: 1px solid #444;

    }


    button {

      border: none;

      background: white;

      color: black;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

    }


    video {

      width: 100%;

      margin-top: 20px;

      border-radius: 10px;

      display: none;

    }


    #status {

      color: #aaa;

      margin-top: 20px;

      font-size: 14px;

      line-height: 1.5;

    }


    #download {

      display: none;

      margin-top: 15px;

      color: white;

      font-weight: bold;

    }

  </style>

</head>


<body>


<div class="box">


  <h1>
    DIIZAM METHOD
  </h1>


  <div class="subtitle">
    Video Processing
  </div>


  <!-- =========================
       VIDEO INPUT
  ========================== -->

  <input
    type="file"
    id="videoInput"
    accept="video/*"
  >


  <!-- =========================
       METHOD
  ========================== -->

  <select id="method">

    <option value="original">
      Original
    </option>

    <option value="hd">
      HD Quality
    </option>

    <option value="60">
      60 FPS
    </option>

    <option value="120">
      120 FPS
    </option>

    <option value="true60">
      True 60 FPS
    </option>

    <option value="true120">
      True 120 FPS
    </option>

  </select>


  <!-- =========================
       PROCESS
  ========================== -->

  <button
    id="processButton"
    onclick="processVideo()"
  >
    PROCESS VIDEO
  </button>


  <!-- =========================
       TEST RIFE
  ========================== -->

  <button
    onclick="testRIFE()"
  >
    TEST RIFE
  </button>


  <!-- =========================
       TEST CODEC
  ========================== -->

  <button
    onclick="testCodec()"
  >
    TEST CODEC
  </button>


  <!-- =========================
       PREVIEW
  ========================== -->

  <video
    id="preview"
    controls
  ></video>


  <!-- =========================
       STATUS
  ========================== -->

  <div id="status">
    Pilih video terlebih dahulu.
  </div>


  <!-- =========================
       DOWNLOAD
  ========================== -->

  <a
    id="download"
    download="diizam-output.mp4"
  >
    DOWNLOAD VIDEO
  </a>


</div>


<!-- =====================================================
     MEDIABUNNY
====================================================== -->

<script type="module">

  try {

    const MediabunnyModule =
      await import(
        "https://cdn.jsdelivr.net/npm/mediabunny@1.61.0/+esm"
      );


    window.Mediabunny =
      MediabunnyModule;


    window.MediabunnyReady =
      true;


    console.log(
      "Mediabunny berhasil dimuat:",
      window.Mediabunny
    );

  }

  catch (error) {

    window.MediabunnyReady =
      false;


    console.error(
      "Mediabunny gagal dimuat:",
      error
    );

  }

</script>


<!-- =====================================================
     MAIN JAVASCRIPT
====================================================== -->

<script>


/* =====================================================
   ELEMENT
====================================================== */

const videoInput =
  document.getElementById(
    "videoInput"
  );


const preview =
  document.getElementById(
    "preview"
  );


const status =
  document.getElementById(
    "status"
  );


const download =
  document.getElementById(
    "download"
  );


const processButton =
  document.getElementById(
    "processButton"
  );


/* =====================================================
   BACKEND
====================================================== */

const BACKEND_URL =
  "https://diizam-production.up.railway.app";


/* =====================================================
   PREVIEW VIDEO
====================================================== */

videoInput.addEventListener(
  "change",
  function () {

    const file =
      this.files[0];


    if (!file) {

      return;

    }


    const url =
      URL.createObjectURL(
        file
      );


    preview.src =
      url;


    preview.style.display =
      "block";


    download.style.display =
      "none";


    status.textContent =
      "Video siap. Pilih method lalu tekan PROCESS VIDEO.";

  }
);


/* =====================================================
   PROCESS VIDEO
====================================================== */

async function processVideo() {


  const file =
    videoInput.files[0];


  if (!file) {

    status.textContent =
      "Pilih video terlebih dahulu.";

    return;

  }


  const method =
    document
      .getElementById("method")
      .value;


  /* =========================
     TRUE FPS
  ========================== */

  if (
    method === "true60"
  ) {

    await processTrueFPS(
      file,
      60
    );

    return;

  }


  if (
    method === "true120"
  ) {

    await processTrueFPS(
      file,
      120
    );

    return;

  }


  /* =========================
     ORIGINAL
  ========================== */

  if (
    method === "original"
  ) {

    status.textContent =
      "Pilih method terlebih dahulu.";

    return;

  }


  /* =========================
     BACKEND PROCESSING
  ========================== */

  processButton.disabled =
    true;


  download.style.display =
    "none";


  status.textContent =
    "Mengupload dan memproses video...";


  const formData =
    new FormData();


  formData.append(
    "video",
    file
  );


  formData.append(
    "method",
    method
  );


  try {


    const response =
      await fetch(

        BACKEND_URL +
        "/process",

        {

          method: "POST",

          body: formData

        }

      );


    if (!response.ok) {

      throw new Error(
        "Server gagal memproses video."
      );

    }


    const blob =
      await response.blob();


    const url =
      URL.createObjectURL(
        blob
      );


    preview.src =
      url;


    preview.style.display =
      "block";


    download.href =
      url;


    download.style.display =
      "block";


    status.textContent =
      "Selesai! Video berhasil diproses.";

  }


  catch (error) {


    console.error(
      "PROCESS ERROR:",
      error
    );


    status.textContent =
      "Gagal memproses video: " +
      error.message;

  }


  finally {

    processButton.disabled =
      false;

  }

}


/* =====================================================
   TEST RIFE
====================================================== */

async function testRIFE() {


  alert(
    "TEST RIFE ditekan. Memuat model..."
  );


  try {


    if (!window.ort) {

      throw new Error(
        "ONNX Runtime tidak termuat."
      );

    }


    if (!navigator.gpu) {

      throw new Error(
        "WebGPU tidak tersedia."
      );

    }


    status.textContent =
      "Memuat RIFE AI...";


    const session =
      await ort.InferenceSession.create(

        "https://huggingface.co/edgetools/rife/resolve/main/rife49.onnx",

        {

          executionProviders:
            [
              "webgpu"
            ]

        }

      );


    window.rifeSession =
      session;


    console.log(
      "RIFE:",
      session
    );


    status.textContent =
      "RIFE WebGPU siap!";


    alert(
      "RIFE WebGPU siap!"
    );

  }


  catch (error) {


    console.error(
      "RIFE ERROR:",
      error
    );


    status.textContent =
      "RIFE gagal dimuat.";


    alert(
      "RIFE gagal dimuat:\n\n" +
      error.message
    );

  }

}


/* =====================================================
   TEST CODEC
====================================================== */

async function testCodec() {


  try {


    status.textContent =
      "Mengecek Mediabunny...";


    let tries =
      0;


    while (

      !window.Mediabunny &&

      tries < 50

    ) {


      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            100
          )
      );


      tries++;

    }


    if (
      !window.Mediabunny
    ) {


      throw new Error(
        "Mediabunny gagal dimuat."
      );

    }


    const codecs =
      await
      window.Mediabunny
        .getEncodableVideoCodecs();


    console.log(
      "Codec tersedia:",
      codecs
    );


    if (
      codecs.includes("avc")
    ) {


      status.textContent =
        "H.264 / AVC tersedia!";


      alert(
        "Mediabunny berhasil!\n\n" +
        "H.264 / AVC tersedia!"
      );

    }

    else {


      status.textContent =
        "Mediabunny aktif, tetapi H.264 tidak tersedia.";


      alert(
        "Mediabunny aktif.\n\n" +
        "H.264 / AVC tidak tersedia."
      );

    }

  }


  catch (error) {


    console.error(
      "CODEC ERROR:",
      error
    );


    status.textContent =
      "Tes codec gagal.";


    alert(
      "Tes codec gagal:\n\n" +
      error.message
    );

  }

}


/* =====================================================
   TRUE FPS
====================================================== */

async function processTrueFPS(
  file,
  targetFPS
) {


  processButton.disabled =
    true;


  download.style.display =
    "none";


  try {


    /* =========================
       CEK LIBRARY
    ========================== */

    status.textContent =
      "Menyiapkan True " +
      targetFPS +
      " FPS...";


    if (!window.ort) {

      throw new Error(
        "ONNX Runtime tidak termuat."
      );

    }


    if (!navigator.gpu) {

      throw new Error(
        "WebGPU tidak tersedia."
      );

    }


    if (!window.Mediabunny) {

      throw new Error(
        "Mediabunny belum termuat."
      );

    }


    /* =========================
       LOAD RIFE
    ========================== */

    status.textContent =
      "Memuat model RIFE...";


    let rife =
      window.rifeSession;


    if (!rife) {


      rife =
        await ort.InferenceSession.create(

          "https://huggingface.co/edgetools/rife/resolve/main/rife49.onnx",

          {

            executionProviders:
              [
                "webgpu"
              ]

          }

        );


      window.rifeSession =
        rife;

    }


    /* =========================
       MEDIABUNNY CLASSES
    ========================== */

    const {

      Input,
      BlobSource,
      ALL_FORMATS,
      CanvasSink,
      Output,
      BufferTarget,
      Mp4OutputFormat,
      CanvasSource,
      Quality

    } =
      window.Mediabunny;


    /* =========================
       INPUT VIDEO
    ========================== */

    status.textContent =
      "Membaca video...";


    const input =
      new Input({

        formats:
          ALL_FORMATS,

        source:
          new BlobSource(
            file
          )

      });


    const videoTrack =
      await input
        .getPrimaryVideoTrack();


    if (!videoTrack) {

      throw new Error(
        "Video track tidak ditemukan."
      );

    }


    /* =========================
       VIDEO INFORMATION
    ========================== */

    const width =
      videoTrack.displayWidth;


    const height =
      videoTrack.displayHeight;


    const duration =
      videoTrack.duration;


    const sourceFPS =
      videoTrack.frameRate ||
      30;


    console.log(
      "Video:",
      width,
      height,
      sourceFPS,
      duration
    );


    /* =========================
       BATAS RESOLUSI AI
    ========================== */

    const maxInferenceWidth =
      640;


    let aiWidth =
      width;


    let aiHeight =
      height;


    if (
      aiWidth >
      maxInferenceWidth
    ) {


      const scale =
        maxInferenceWidth /
        aiWidth;


      aiWidth =
        Math.round(
          aiWidth *
          scale
        );


      aiHeight =
        Math.round(
          aiHeight *
          scale
        );

    }


    /*
      RIFE membutuhkan ukuran
      yang merupakan kelipatan 32.
    */

    aiWidth =
      Math.floor(
        aiWidth / 32
      ) * 32;


    aiHeight =
      Math.floor(
        aiHeight / 32
      ) * 32;


    if (
      aiWidth < 32
    ) {

      aiWidth =
        32;

    }


    if (
      aiHeight < 32
    ) {

      aiHeight =
        32;

    }


    console.log(
      "AI size:",
      aiWidth,
      aiHeight
    );


    /* =========================
       INPUT CANVAS
    ========================== */

    const sink =
      new CanvasSink(

        videoTrack,

        {

          width:
            aiWidth,

          height:
            aiHeight,

          fit:
            "fill",

          poolSize:
            3

        }

      );


    /* =========================
       OUTPUT CANVAS
    ========================== */

    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      aiWidth;


    canvas.height =
      aiHeight;


    const ctx =
      canvas.getContext(
        "2d"
      );


    /* =========================
       MP4 OUTPUT
    ========================== */

    status.textContent =
      "Menyiapkan MP4...";


    const output =
      new Output({

        format:
          new Mp4OutputFormat({
            fastStart:
              "in-memory"
          }),

        target:
          new BufferTarget()

      });


    const bitrate =
      Math.max(

        2_500_000,

        aiWidth *
        aiHeight *
        5

      );


    const videoSource =
      new CanvasSource(

        canvas,

        {

          codec:
            "avc",

          quality:
            new Quality({
              bitrate:
                bitrate
            })

        }

      );


    output.addVideoTrack(
      videoSource,
      {
        frameRate:
          targetFPS
      }
    );


    await output.start();


    /* =========================
       HELPER
    ========================== */

    function canvasToTensor(
      source
    ) {


      const sourceCtx =
        source.getContext(
          "2d"
        );


      const image =
        sourceCtx.getImageData(

          0,

          0,

          aiWidth,

          aiHeight

        );


      const pixelCount =
        aiWidth *
        aiHeight;


      const data =
        new Float32Array(
          pixelCount * 3
        );


      for (
        let i = 0;
        i < pixelCount;
        i++
      ) {


        const p =
          i * 4;


        data[i] =
          image.data[p] /
          255;


        data[
          pixelCount + i
        ] =
          image.data[
            p + 1
          ] / 255;


        data[
          pixelCount * 2 + i
        ] =
          image.data[
            p + 2
          ] / 255;

      }


      return new ort.Tensor(

        "float32",

        data,

        [
          1,
          3,
          aiHeight,
          aiWidth
        ]

      );

    }


    function tensorToCanvas(
      tensor
    ) {


      const data =
        tensor.data;


      const image =
        ctx.createImageData(

          aiWidth,

          aiHeight

        );


      const pixelCount =
        aiWidth *
        aiHeight;


      for (
        let i = 0;
        i < pixelCount;
        i++
      ) {


        const p =
          i * 4;


        image.data[p] =
          Math.max(
            0,
            Math.min(
              255,
              data[i] *
              255
            )
          );


        image.data[
          p + 1
        ] =
          Math.max(
            0,
            Math.min(
              255,
              data[
                pixelCount + i
              ] *
              255
            )
          );


        image.data[
          p + 2
        ] =
          Math.max(
            0,
            Math.min(
              255,
              data[
                pixelCount * 2 + i
              ] *
              255
            )
          );


        image.data[
          p + 3
        ] =
          255;

      }


      ctx.putImageData(
        image,
        0,
        0
      );

    }


    /* =========================
       FRAME BUFFER
    ========================== */

    let previous =
      null;


    let frameIndex =
      0;


    let outputIndex =
      0;


    const frameDuration =
      1 /
      targetFPS;


    const multiplier =
      targetFPS /
      sourceFPS;


    /*
      Jumlah frame baru
      di antara dua frame asli.

      30 -> 60 = 1
      30 -> 120 = 3
      60 -> 120 = 1
    */

    const intermediateCount =
      Math.max(

        0,

        Math.round(
          multiplier
        ) - 1

      );


    /* =========================
       PROCESS FRAME
    ========================== */

    for await (
      const wrapped
      of sink.canvases()
    ) {


      const frameCanvas =
        wrapped.canvas ||
        wrapped;


      if (!previous) {


        previous =
          frameCanvas;


        /*
          Frame pertama
        */

        ctx.clearRect(
          0,
          0,
          aiWidth,
          aiHeight
        );


        ctx.drawImage(
          previous,
          0,
          0,
          aiWidth,
          aiHeight
        );


        await videoSource.add(

          outputIndex *
          frameDuration,

          frameDuration

        );


        outputIndex++;

        frameIndex++;


        continue;

      }


      /* =========================
         FRAME A
      ========================== */

      const canvasA =
        document.createElement(
          "canvas"
        );


      canvasA.width =
        aiWidth;


      canvasA.height =
        aiHeight;


      const ctxA =
        canvasA.getContext(
          "2d"
        );


      ctxA.drawImage(

        previous,

        0,
        0,

        aiWidth,
        aiHeight

      );


      /* =========================
         FRAME B
      ========================== */

      const canvasB =
        document.createElement(
          "canvas"
        );


      canvasB.width =
        aiWidth;


      canvasB.height =
        aiHeight;


      const ctxB =
        canvasB.getContext(
          "2d"
        );


      ctxB.drawImage(

        frameCanvas,

        0,
        0,

        aiWidth,
        aiHeight

      );


      const img0 =
        canvasToTensor(
          canvasA
        );


      const img1 =
        canvasToTensor(
          canvasB
        );


      /* =========================
         RIFE INTERPOLATION
      ========================== */

      for (
        let j = 0;
        j <= intermediateCount;
        j++
      ) {


        if (
          j === 0
        ) {


          ctx.clearRect(
            0,
            0,
            aiWidth,
            aiHeight
          );


          ctx.drawImage(
            canvasA,
            0,
            0
          );

        }


        else {


          const timestep =
            j /
            (
              intermediateCount +
              1
            );


          const timestepTensor =
            new ort.Tensor(

              "float32",

              new Float32Array([
                timestep
              ]),

              [1]

            );


          const result =
            await rife.run({

              img0:
                img0,

              img1:
                img1,

              timestep:
                timestepTensor

            });


          tensorToCanvas(
            result.output
          );

        }


        await videoSource.add(

          outputIndex *
          frameDuration,

          frameDuration

        );


        outputIndex++;

      }


      previous =
        frameCanvas;


      frameIndex++;


      /* =========================
         PROGRESS
      ========================== */

      const progress =
        Math.min(

          99,

          Math.round(

            (
              frameIndex /
              Math.max(
                1,
                duration *
                sourceFPS
              )
            ) * 100

          )

        );


      status.textContent =
        "True " +
        targetFPS +
        " FPS: " +
        progress +
        "%";


      /*
        Beri kesempatan UI
        HP untuk bernapas.
      */

      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            0
          )
      );

    }


    /* =========================
       FINALIZE
    ========================== */

    videoSource.close();


    status.textContent =
      "Menyelesaikan MP4...";


    await output.finalize();


    const buffer =
      output.target.buffer;


    if (!buffer) {

      throw new Error(
        "Buffer MP4 kosong."
      );

    }


    const blob =
      new Blob(

        [buffer],

        {
          type:
            "video/mp4"
        }

      );


    const url =
      URL.createObjectURL(
        blob
      );


    preview.src =
      url;


    preview.style.display =
      "block";


    download.href =
      url;


    download.style.display =
      "block";


    status.textContent =
      "Selesai! True " +
      targetFPS +
      " FPS berhasil dibuat.";

  }


  catch (error) {


    console.error(
      "TRUE FPS ERROR:",
      error
    );


    status.textContent =
      "True " +
      targetFPS +
      " FPS gagal: " +
      error.message;


    alert(

      "True " +
      targetFPS +
      " FPS gagal:\n\n" +
      error.message

    );

  }


  finally {

    processButton.disabled =
      false;

  }

}


</script>


</body>

</html>
